# The controller buttons for Out Of Order. a, b, x and y are the bottom,
# right, left and top buttons, whatever their labels are on the controller.
#
# In Out Of Order, the player chooses an action, such as "Look at" or
# "Use", with the right mouse button, and does it with the left one.
a = left click
b = right click
# The player opens the inventory with Space and quick-saves with S.
x = key space
y = key s
start = key escape
leftshoulder = previous hotspot
rightshoulder = next hotspot
# With minus and plus, the player makes the speech slower or faster.
lefttrigger = key -
righttrigger = key +
